name: Coletar notícias

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coletar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Organizar as pastas (só faz algo na primeira vez)
        run: |
          mkdir -p data scripts
          for f in feed.json manual.json promessas.json municipios.json; do
            if [ -f "$f" ]; then git mv -f "$f" "data/$f"; fi
          done
          for f in coletar.py fontes.json; do
            if [ -f "$f" ]; then git mv -f "$f" "scripts/$f"; fi
          done
          if [ -f coletar.yml ]; then git rm -q coletar.yml; fi
      - name: Ler os jornais
        run: python scripts/coletar.py
      - name: Imagem de prévia do WhatsApp (só se faltar)
        run: |
          if [ ! -f og.jpg ] && [ -f scripts/og.html ]; then
            for b in google-chrome chromium chromium-browser; do
              if command -v $b >/dev/null; then
                $b --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=8000 --window-size=1200,630 --screenshot="$PWD/og.jpg" "file://$PWD/scripts/og.html" && break
              fi
            done
          fi
          ls -la og.jpg || echo "sem og.jpg"
      - name: Salvar no site
        run: |
          git config user.name "robo-paulistania"
          git config user.email "robo-paulistania@users.noreply.github.com"
          git add -A data scripts
          if [ -f og.jpg ]; then git add og.jpg; fi
          if git diff --cached --quiet; then
            echo "Nada novo nesta coleta."
          else
            git commit -m "Notícias atualizadas $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
